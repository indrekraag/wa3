name: Fetch EMHI weather warnings

# Every 15 min, pull the latest EMHI XML (stations) + MeteoAlarm EE/FI CAP
# warnings and force-push emhi.json as a single rolling commit on a 'data'
# orphan branch. The PWA reads it via raw.githubusercontent.com (CORS-open),
# bypassing EMHI's / MeteoAlarm's CORS blocks without polluting main's git
# history.

on:
  schedule:
    # GitHub schedules are best-effort and can be delayed by 5–30 min
    # during peak load. That's fine — the displayed data is ambient.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  # Re-run when the script or workflow itself changes, so first deploy
  # populates the data branch immediately rather than waiting 15 min.
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_emhi.py'
      - '.github/workflows/emhi.yml'

permissions:
  contents: write

concurrency:
  group: emhi-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch EMHI snapshot
        id: fetch
        run: |
          # The script soft-fails (exit 0, no file, wrote=false) on a
          # transient EMHI/Cloudflare outage so the cron doesn't email.
          python3 scripts/fetch_emhi.py --out /tmp/emhi.json
          if [ -f /tmp/emhi.json ]; then echo "--- emhi ---"; cat /tmp/emhi.json; fi

      # Push only when the fetch produced a fresh file this run; a soft
      # failure skips the push so the data branch keeps its last-good copy.
      - name: Push to data branch
        if: steps.fetch.outputs.wrote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          cp /tmp/emhi.json emhi.json
          git add -A
          git commit -q -m "data: emhi snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force origin data:data
          echo "✓ Pushed emhi.json to 'data' branch"
          echo "  https://raw.githubusercontent.com/${{ github.repository }}/data/emhi.json"
